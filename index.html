<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Survivor</title>
        <style id="gateStyle">
            html,
            body {
                margin: 0;
                height: 100%;
                background: #0d0b16;
                color: #eee;
                font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            }
            #gate {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
                box-sizing: border-box;
            }
            #gate form {
                width: 100%;
                max-width: 320px;
                background: #171427;
                border: 1px solid #2c2845;
                border-radius: 14px;
                padding: 24px 20px;
                text-align: center;
            }
            #gate h1 {
                font-size: 20px;
                margin: 0 0 16px;
            }
            #gate input[type='password'] {
                width: 100%;
                box-sizing: border-box;
                padding: 12px;
                border-radius: 10px;
                border: 1px solid #3a3560;
                background: #0d0b16;
                color: #fff;
                font-size: 16px;
            }
            #gate label {
                display: block;
                margin: 12px 0;
                font-size: 14px;
                color: #bbb;
            }
            #gate button {
                width: 100%;
                padding: 12px;
                border: 0;
                border-radius: 10px;
                background: #5b6ee1;
                color: #fff;
                font-size: 16px;
            }
            #gate button:disabled {
                opacity: 0.6;
            }
            #gateBar {
                display: none;
                height: 14px;
                margin-top: 16px;
                border-radius: 7px;
                background: rgba(255, 255, 255, 0.18);
                overflow: hidden;
            }
            #gateBar i {
                display: block;
                width: 0;
                height: 100%;
                border-radius: 7px;
                background: linear-gradient(90deg, #ff8fb1, #ffd36e);
                transition: width 0.15s linear;
            }
            #gatePct {
                min-height: 20px;
                margin-top: 8px;
                font-size: 14px;
                color: #fff;
            }
            #gateMsg {
                min-height: 20px;
                margin-top: 10px;
                font-size: 14px;
                color: #ff9ab0;
            }
        </style>
    </head>
    <body>
        <div id="gate">
            <form id="gateForm" autocomplete="off">
                <h1>🔒 비밀번호를 입력해 주세요</h1>
                <input id="gatePw" type="password" autocomplete="current-password" autofocus />
                <label><input id="gateRemember" type="checkbox" checked /> 이 기기에서 기억하기</label>
                <button id="gateBtn" type="submit">들어가기</button>
                <div id="gateBar"><i></i></div>
                <div id="gatePct"></div>
                <div id="gateVer" style="margin-top: 10px; font-size: 11px; opacity: 0.45"></div>
                <div id="gateMsg" role="status"></div>
            </form>
        </div>
        <script>
            (function () {
                const META = {"v":1,"title":"귀멸 서바이버즈","salt":"rBMk7bDatOTGCMq8mWQFSw==","iterations":600000,"tracks":[{"file":"t-c6749a7950c9cbb8.bin","type":"audio/mp4","group":"rest"},{"file":"t-a42fd4afb6640d62.bin","type":"audio/mp4","group":"rest"},{"file":"t-74a0c4ec09afc480.bin","type":"audio/mp4","group":"rest"},{"file":"t-b2d0e544c63c5152.bin","type":"audio/mp4","group":"rest"},{"file":"t-0db8cb72712f2ad9.bin","type":"audio/mp4","group":"rest"}],"parts":[{"f":"p-33fecc770fbbc064.bin","n":27853135,"k":"art"},{"f":"p-3212954ebbfbf440.bin","n":1288175,"k":"art"},{"f":"p-59639c5045c07b91.bin","n":2136982,"k":"art"},{"f":"p-0a3435bac8dee242.bin","n":475779,"k":"art"},{"f":"p-f1a1d94e29f31637.bin","n":756954,"k":"art"},{"f":"p-d5bfd752f87877d2.bin","n":11942928,"k":"art"},{"f":"p-dd484ead2fcc460f.bin","n":2773767,"k":"lazy"},{"f":"p-280177d7831d4c39.bin","n":3439044,"k":"lazy"},{"f":"p-30fa7d2c4918058b.bin","n":3612901,"k":"lazy"},{"f":"p-6f5291da3e78de30.bin","n":3410050,"k":"lazy"},{"f":"p-b2a6b430cce720e8.bin","n":3215558,"k":"lazy"},{"f":"p-6225dd59bccf524f.bin","n":3539710,"k":"lazy"},{"f":"p-ad772c7c962c8e8f.bin","n":3006366,"k":"lazy"},{"f":"p-da741ac9986a4786.bin","n":3094315,"k":"lazy"},{"f":"p-63d894b16ccd6b2c.bin","n":3064140,"k":"lazy"},{"f":"p-75ea1d7081a8ac74.bin","n":4597445,"k":"lazy"},{"f":"p-9e8000cf72cffd6b.bin","n":2085642,"k":"lazy"},{"f":"p-9b482907e18c4b3c.bin","n":2648626,"k":"lazy"},{"f":"p-c27834e35b2917d8.bin","n":3322107,"k":"lazy"},{"f":"p-155ce03d3668cf89.bin","n":3652308,"k":"lazy"},{"f":"p-86c60ce5b7f78f0f.bin","n":3141476,"k":"lazy"},{"f":"p-b06919f72d76a4dd.bin","n":3117848,"k":"lazy"},{"f":"p-60423735ada4524e.bin","n":3232352,"k":"lazy"},{"f":"p-dc75039207dc5216.bin","n":953124,"k":"sfx","s":"b","i":0},{"f":"p-8e7d99972bcf8ef3.bin","n":2542071,"k":"sfx","s":"b","i":0},{"f":"p-28fdbd2ab2c5dfb2.bin","n":2938,"k":"sfx","s":"b","i":0},{"f":"p-d0f5fe4bb5ad4984.bin","n":1063033,"k":"sfx","s":"b","i":0},{"f":"p-c12855d53016e614.bin","n":668165,"k":"lazy"},{"f":"p-d9b41fb9420c76fb.bin","n":4458,"k":"lazy"},{"f":"p-b949982a5a14c107.bin","n":4935784,"k":"lazy"},{"f":"p-f9ba3d057e6c9d67.bin","n":2043842,"k":"lazy"},{"f":"p-315d207c1d045e91.bin","n":8548,"k":"lazy"},{"f":"p-e1d5a6c49b04b156.bin","n":2194563,"k":"lazy"},{"f":"p-8bf59432c48a1234.bin","n":682217,"k":"lazy"},{"f":"p-7ae30743dbe8b8ed.bin","n":2967,"k":"lazy"},{"f":"p-fe16d553d357cb45.bin","n":2550366,"k":"lazy"},{"f":"p-a3c3f94462c813ac.bin","n":910026,"k":"lazy"},{"f":"p-fdb2ca2ce9373601.bin","n":4700,"k":"lazy"},{"f":"p-70de26d728bb0465.bin","n":5496515,"k":"lazy"},{"f":"p-1a571cf84924aa08.bin","n":654031,"k":"lazy"},{"f":"p-b962ffcb6c8d03bb.bin","n":4484,"k":"lazy"},{"f":"p-58f1bd12580481a7.bin","n":5720888,"k":"lazy"},{"f":"p-fb9bb9791c38c3cf.bin","n":689342,"k":"lazy"},{"f":"p-48298bc7f7f6e919.bin","n":4506,"k":"lazy"},{"f":"p-3db07ed889fb326f.bin","n":4931834,"k":"lazy"},{"f":"p-481c5625d7ce995c.bin","n":604670,"k":"lazy"},{"f":"p-b2d99ba2db1d5ca2.bin","n":4480,"k":"lazy"},{"f":"p-4a0929e0c4007310.bin","n":5065662,"k":"lazy"},{"f":"p-3b99a4529024ef6d.bin","n":1211634,"k":"sfx","s":"b","i":1},{"f":"p-732bcaa1ce24c971.bin","n":1141242,"k":"sfx","s":"b","i":1},{"f":"p-697e8f011e270982.bin","n":2306,"k":"sfx","s":"b","i":1},{"f":"p-a11c93a28d686706.bin","n":1059428,"k":"sfx","s":"c","i":0},{"f":"p-ee46935d44a58a99.bin","n":2746124,"k":"sfx","s":"c","i":0},{"f":"p-a662df82773e8681.bin","n":28825,"k":"sfx","s":"c","i":0},{"f":"p-190588166b39779f.bin","n":13153278,"k":"sfx","s":"c","i":0},{"f":"p-a3978730cf2c5700.bin","n":2345649,"k":"lazy"},{"f":"p-ed1aebc28af9b2c2.bin","n":2829,"k":"lazy"},{"f":"p-f9ba3d057e6c9d67.bin","n":2043842,"k":"lazy"},{"f":"p-ba4fd0ec0d0ea9dd.bin","n":4145,"k":"lazy"},{"f":"p-6308b4a882c64a75.bin","n":2105916,"k":"lazy"},{"f":"p-2895e9a66857b718.bin","n":2365,"k":"lazy"},{"f":"p-ebc4dc7f0c3b4925.bin","n":2913525,"k":"lazy"},{"f":"p-7d4eec27abe81ab8.bin","n":2997,"k":"lazy"},{"f":"p-cca4c9705d3c0aa2.bin","n":2025038,"k":"lazy"},{"f":"p-8db98399a5c634d0.bin","n":2604,"k":"lazy"},{"f":"p-3d3dfa43b0e6e093.bin","n":2321067,"k":"lazy"},{"f":"p-f5d3d6964393e9dc.bin","n":2560,"k":"lazy"},{"f":"p-846e6986e08e7ff1.bin","n":2308648,"k":"lazy"},{"f":"p-64572c8899c11874.bin","n":2881,"k":"lazy"},{"f":"p-9ca6d34f2324cbd9.bin","n":603263,"k":"sfx","s":"c","i":1},{"f":"p-b9147b5c41c87ff1.bin","n":1659696,"k":"sfx","s":"c","i":1},{"f":"p-ba9f64531c2887f4.bin","n":10512,"k":"sfx","s":"c","i":1},{"f":"p-657e7c1accc8d0d7.bin","n":6466318,"k":"sfx","s":"c","i":1},{"f":"core-197b28b7a05172b2.bin","n":1291272,"k":"core"}],"ver":"2026.10.14-1519","maxSeconds":0};
                const STORE = 'gate.key.' + META.salt;
                const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
                const toB64 = (u8) => btoa(String.fromCharCode.apply(null, u8));
                const msg = document.getElementById('gateMsg');
                const btn = document.getElementById('gateBtn');

                async function derive(pw, extractable) {
                    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, [
                        'deriveKey'
                    ]);
                    return crypto.subtle.deriveKey(
                        { name: 'PBKDF2', salt: b64(META.salt), iterations: META.iterations, hash: 'SHA-256' },
                        base,
                        { name: 'AES-GCM', length: 256 },
                        extractable,
                        ['decrypt']
                    );
                }

                // The loading bar (shown while the game file comes down).
                if (META.ver) document.getElementById('gateVer').textContent = '버전 ' + META.ver;
                const bar = document.getElementById('gateBar');
                const pct = document.getElementById('gatePct');
                function progress(done, total, fresh) {
                    bar.style.display = 'block';
                    const mb = (n) => (n / 1048576).toFixed(0);
                    if (total) {
                        const f = Math.min(1, done / total);
                        bar.firstElementChild.style.width = (f * 100).toFixed(1) + '%';
                        // (fresh: what is really being downloaded; the rest was already on this device)
                        const what = fresh === undefined || fresh > 0 ? `새로 받는 중 ${mb(fresh || 0)}MB` : '저장된 파일을 여는 중';
                        pct.textContent = f < 1 ? `불러오는 중… ${Math.round(f * 100)}% (${what})` : '거의 다 됐어요… 게임을 준비하고 있어요';
                    } else {
                        bar.firstElementChild.style.width = '100%';
                        pct.textContent = `불러오는 중… ${mb(done)}MB`;
                    }
                }

                // The game comes in parts (META.parts): the script, each hero's pictures, each group of
                // sounds. A part's file name carries the fingerprint of what is in it, so a part that has
                // not changed keeps its name from one version to the next. Parts already fetched are kept
                // on this device (Cache Storage) and are not downloaded again: after the first visit only
                // what changed comes down. Parts of older versions are thrown away once the game is up.
                const SHELF = 'game-parts:' + location.pathname.replace(/[^/]*$/, '');
                let shelf = null;
                const shelfReady = (async () => {
                    try {
                        shelf = await caches.open(SHELF);
                        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
                    } catch (e) {
                        shelf = null; // (no storage here: everything is simply downloaded each time)
                    }
                })();

                /** The bytes of data/<file>: from this device if they are here, else downloaded (and kept). */
                async function getBytes(file, size, onChunk) {
                    await shelfReady;
                    const url = 'data/' + file;
                    if (shelf) {
                        try {
                            const hit = await shelf.match(url);
                            if (hit) {
                                const kept = new Uint8Array(await hit.arrayBuffer());
                                if (!size || kept.length === size) {
                                    if (onChunk) onChunk(kept.length, true);
                                    return kept;
                                }
                                await shelf.delete(url); // (cut short once: fetch it again)
                            }
                        } catch (e) {}
                    }
                    const res = await fetch(url, { cache: 'no-store' });
                    if (!res.ok) throw new Error('fetch ' + file);
                    let buf;
                    if (res.body && res.body.getReader) {
                        const reader = res.body.getReader();
                        const got = [];
                        let n = 0;
                        for (;;) {
                            const step = await reader.read();
                            if (step.done) break;
                            got.push(step.value);
                            n += step.value.length;
                            if (onChunk) onChunk(step.value.length, false);
                        }
                        buf = new Uint8Array(n);
                        let at = 0;
                        for (const part of got) {
                            buf.set(part, at);
                            at += part.length;
                        }
                    } else {
                        buf = new Uint8Array(await res.arrayBuffer());
                        if (onChunk) onChunk(buf.length, false);
                    }
                    if (size && buf.length !== size) throw new Error('fetch ' + file + ': ' + buf.length + ' of ' + size);
                    if (shelf) {
                        try {
                            await shelf.put(url, new Response(buf, { headers: { 'Content-Type': 'application/octet-stream' } }));
                        } catch (e) {
                            // (no room: it will be downloaded again next time)
                        }
                    }
                    return buf;
                }

                const open = (key, buf) => crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));

                /** Parts of versions that are no longer the game's: off this device. */
                async function tidyShelf() {
                    if (!shelf) return;
                    const mine = new Set([...(META.parts || []).map((q) => q.f), ...META.tracks.map((t) => t.file)]);
                    try {
                        for (const req of await shelf.keys()) {
                            const name = req.url.split('/').pop();
                            if (!mine.has(name)) await shelf.delete(req);
                        }
                    } catch (e) {}
                }

                async function fetchDecrypt(key, file) {
                    return open(key, await getBytes(file, 0));
                }

                // A wrong key shows up as a failed decrypt; anything else (no network,
                // a download cut short, the phone short of memory) is not the password's fault.
                const wrongKey = (err) => !!err && err.name === 'OperationError';

                async function launch(key, onUnlocked) {
                    // Throws on a wrong key (GCM tag mismatch).
                    const parts = META.parts;
                    const sizeOf = Object.fromEntries(parts.map((q) => [q.f, q.n]));
                    const first = parts.filter((q) => q.k !== 'lazy');
                    const total = first.reduce((sum, q) => sum + q.n, 0);
                    let done = 0;
                    let fresh = 0; // (bytes that really came down the line this time)
                    const tick = (n, kept) => {
                        done += n;
                        if (!kept) fresh += n;
                        progress(done, total, fresh);
                    };
                    progress(0, total, 0);
                    const text = async (f, note) => new TextDecoder().decode(await open(key, await getBytes(f, sizeOf[f], note)));
                    // (the script first: it is small, and a wrong password shows at once)
                    const app = JSON.parse(await text(parts.find((q) => q.k === 'core').f, tick));
                    if (onUnlocked) onUnlocked();
                    app.art = {};
                    const sfx = {};
                    for (const q of first) {
                        if (q.k === 'core') continue;
                        const obj = JSON.parse(await text(q.f, tick));
                        if (q.k === 'art') Object.assign(app.art, obj);
                        else if (q.k === 'sfx') {
                            // (one object of files for each folder of a set, in the folders' order)
                            const list = (sfx[q.s] = sfx[q.s] || []);
                            list[q.i] = Object.assign(list[q.i] || {}, obj);
                        }
                    }
                    for (const set in sfx) sfx[set] = sfx[set].filter(Boolean);
                    if (Object.keys(sfx).length) window.__SFX_FILES = sfx;

                    // The parts that belong to one hero come when that hero is wanted (app.lazy says
                    // which). The game asks through these two; each part is fetched once (and is on the
                    // device from then on).
                    const lazy = app.lazy || { art: {}, sfx: {} };
                    const waitLabel = (what) => {
                        const el = document.getElementById('loading');
                        if (el) el.textContent = what;
                    };
                    const artJobs = {};
                    window.__ART_NEED = (artKey) => {
                        if (app.art[artKey] || artKey.indexOf('heroes/') !== 0) return null;
                        const name = artKey.slice(7);
                        const hero = name.split('_')[0];
                        // (a still or a face: those came at the start, and if one is not there it was never drawn)
                        if (name === hero || (lazy.faces || []).indexOf(name.slice(hero.length + 1)) >= 0) return null;
                        if (!lazy.art[hero]) return null;
                        return (artJobs[hero] =
                            artJobs[hero] ||
                            (async () => {
                                try {
                                    let got = 0;
                                    const all = lazy.art[hero].reduce((sum, f) => sum + sizeOf[f], 0);
                                    for (const f of lazy.art[hero]) {
                                        Object.assign(app.art, JSON.parse(await text(f, (n, kept) => {
                                            got += n;
                                            if (!kept) waitLabel(`캐릭터 받는 중… ${Math.round((got / all) * 100)}%`);
                                        })));
                                    }
                                } catch (e) {
                                    artJobs[hero] = null; // (no network just now: asked again next time)
                                }
                            })());
                    };
                    const sfxJobs = {};
                    window.__SFX_NEED = (hero) =>
                        (sfxJobs[hero] =
                            sfxJobs[hero] ||
                            (async () => {
                                const out = {};
                                try {
                                    for (const q of lazy.sfx[hero] || []) {
                                        const list = (out[q.s] = out[q.s] || []);
                                        list[q.i] = Object.assign(list[q.i] || {}, JSON.parse(await text(q.f)));
                                    }
                                } catch (e) {
                                    sfxJobs[hero] = null;
                                }
                                for (const set in out) out[set] = out[set].filter(Boolean);
                                return out;
                            })());
                    tidyShelf();
                    // BGM: each track decrypts lazily the first time it is needed.
                    const loaders = META.tracks.map((t) => {
                        let p = null;
                        const load = () =>
                            (p =
                                p ||
                                fetchDecrypt(key, t.file).then((buf) =>
                                    URL.createObjectURL(new Blob([buf], { type: t.type }))
                                ));
                        return { group: t.group || 'rest', load };
                    });
                    window.__BGM_TRACKS = Promise.resolve({
                        first: loaders.filter((l) => l.group === 'first').map((l) => l.load),
                        rest: loaders.filter((l) => l.group !== 'first' && l.group !== 'later' && l.group !== 'siren').map((l) => l.load),
                        siren: (loaders.find((l) => l.group === 'siren') || {}).load || null,
                        later: loaders.filter((l) => l.group === 'later').map((l) => l.load),
                        maxSeconds: META.maxSeconds || 0
                    });
                    window.__ART_IMAGES = app.art || {};
                    document.getElementById('gateStyle').remove();
                    const style = document.createElement('style');
                    style.textContent = app.css;
                    document.head.appendChild(style);
                    document.title = META.title || 'Game';
                    document.body.innerHTML = app.body;
                    const s = document.createElement('script');
                    s.src = URL.createObjectURL(new Blob([app.js], { type: 'text/javascript' }));
                    document.body.appendChild(s);
                }

                async function tryStored() {
                    let raw = null;
                    try {
                        raw = localStorage.getItem(STORE);
                    } catch (e) {}
                    if (!raw) return false;
                    // remembered: no need to type anything, just wait for the download
                    const form = document.getElementById('gateForm');
                    const wait = document.createElement('h1');
                    wait.textContent = '⏳ 게임을 불러오는 중이에요';
                    const hide = [].filter.call(form.children, (el) => el !== bar && el !== pct);
                    hide.forEach((el) => (el.style.display = 'none'));
                    form.insertBefore(wait, form.firstChild);
                    const show = () => hide.forEach((el) => (el.style.display = ''));
                    try {
                        const key = await crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', false, ['decrypt']);
                        await launch(key);
                        return true;
                    } catch (e) {
                        wait.remove();
                        bar.style.display = 'none';
                        pct.textContent = '';
                        show();
                        if (wrongKey(e)) {
                            // the password was changed since: forget the old one
                            try {
                                localStorage.removeItem(STORE);
                            } catch (e2) {}
                        } else {
                            // keep the remembered password; this was a loading problem
                            hide.forEach((el) => (el.style.display = 'none'));
                            const retry = document.createElement('h1');
                            retry.innerHTML = '😢 불러오지 못했어요.<br><button type="button" style="margin-top:14px;padding:12px 22px;font-size:16px;border-radius:12px">다시 시도</button>';
                            retry.querySelector('button').onclick = () => location.reload();
                            form.insertBefore(retry, form.firstChild);
                        }
                        return false;
                    }
                }

                document.getElementById('gateForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const pw = document.getElementById('gatePw').value;
                    const remember = document.getElementById('gateRemember').checked;
                    if (!pw) return;
                    btn.disabled = true;
                    msg.textContent = '여는 중... (처음에는 조금 걸려요)';
                    try {
                        const key = await derive(pw, remember);
                        // (remembered as soon as the password is known to be right, before the game starts)
                        const raw = remember ? toB64(new Uint8Array(await crypto.subtle.exportKey('raw', key))) : null;
                        await launch(key, () => {
                            msg.textContent = '맞아요! 게임을 불러오는 중…';
                            if (!raw) return;
                            try {
                                localStorage.setItem(STORE, raw);
                            } catch (e2) {}
                        });
                    } catch (err) {
                        bar.style.display = 'none';
                        pct.textContent = '';
                        msg.textContent = wrongKey(err) ? '비밀번호가 틀렸어요.' : '불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
                        btn.disabled = false;
                    }
                });

                if (!window.crypto || !crypto.subtle) {
                    msg.textContent = 'https 주소로 접속해 주세요.';
                    btn.disabled = true;
                } else {
